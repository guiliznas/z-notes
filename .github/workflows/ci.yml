name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Versão para compilar"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - desktop (ubuntu)
          - mobile (android)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes + TypeCheck + Cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm build:shared

      - name: Test shared
        run: pnpm --filter @z-notes/shared test -- --coverage

      - name: Test server
        run: pnpm --filter @z-notes/server test -- --coverage

      - name: Test web
        run: pnpm --filter @z-notes/web test -- --coverage

      - name: Test mobile
        run: pnpm --filter @z-notes/mobile test -- --coverage

      - name: Type check
        run: pnpm typecheck

  build-desktop:
    name: Build Desktop (Ubuntu)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'desktop (ubuntu)'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo install tauri-cli --version "^2"

      - run: pnpm install --frozen-lockfile

      - name: Test desktop (Rust)
        run: pnpm --filter @z-notes/desktop test

      - name: Build desktop
        run: pnpm build:desktop

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-bundles
          # Só os instaladores: a pasta bundle/ inteira tem centenas de arquivos soltos
          # (árvore do .deb/AppImage) e estoura o rate limit secundário do GitHub no release.
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14

  build-mobile:
    name: Build mobile APK (Android)
    # Opcional enquanto o EXPO_TOKEN não está configurado: não bloqueia o release do desktop.
    continue-on-error: true
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'mobile (android)'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm build:shared

      # --local compila no runner (SDK Android já vem no ubuntu-latest) e grava o .apk em disco;
      # sem isso o EAS compila na nuvem e o upload abaixo não acharia arquivo nenhum.
      - name: Build APK
        run: pnpm --filter @z-notes/mobile build:apk --local --non-interactive --output "$GITHUB_WORKSPACE/z-notes.apk"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: z-notes.apk
          retention-days: 7

  release:
    name: Release
    if: always() && !cancelled() && ((github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    needs: [build-desktop, build-mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download desktop bundles
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: desktop-bundles
          path: ./artifacts/desktop

      - name: Download mobile APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mobile-apk
          path: ./artifacts/mobile

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## z-notes v${{ github.run_number }}

            ### Downloads
            - **Desktop (Ubuntu Linux)**: `.deb`, `.rpm`, `.AppImage`
            - **Mobile (Android)**: APK

            > Para instalar o APK no Android: baixe o arquivo `.apk` e abra no celular.
            > Para instalar no Ubuntu: `sudo dpkg -i z-notes_*.deb`
          files: |
            ./artifacts/desktop/**/*
            ./artifacts/mobile/**/*
          draft: false
          prerelease: false