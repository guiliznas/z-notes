services:
  z-notes:
    build: .
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      # Defina no arquivo .env (docker compose lê automaticamente):
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      Z_NOTES_ADMIN_EMAILS: ${Z_NOTES_ADMIN_EMAILS:-}
      Z_NOTES_SESSION_SECRET: ${Z_NOTES_SESSION_SECRET:?Z_NOTES_SESSION_SECRET é obrigatório}
      Z_NOTES_BACKUP_WEBHOOK_URL: ${Z_NOTES_BACKUP_WEBHOOK_URL:-}
      Z_NOTES_BACKUP_CRON: ${Z_NOTES_BACKUP_CRON:-0 3 * * *}
    volumes:
      # SQLite + espelho .md persistem aqui. Backup = copiar esta pasta.
      - ./data:/app/data
      # Snapshots recorrentes (separado do data/ ativo). Ver README > Backup automático.
      - ./backups:/app/backups
    restart: unless-stopped
